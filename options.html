<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Extractor · Options</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-height: none; min-height: 0; }
    .opt-section { padding: 12px 16px; border-bottom: 1px solid #2d2d4e; }
    .opt-section h2 { margin: 0 0 8px; font-size: 13px; color: #a5b4fc; }
    .opt-section p { margin: 6px 0; color: #94a3b8; line-height: 1.5; }
    .about-links { list-style: none; padding: 0; margin: 8px 0; }
    .about-links li { margin: 6px 0; }
    .about-links a { color: #818cf8; text-decoration: none; }
    .about-links a:hover { text-decoration: underline; }
    .small { font-size: 11px; }
    #update-text a { color: #818cf8; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <span class="logo">📚</span>
        <h1>Learning Extractor · Options</h1>
      </div>
    </header>

    <div class="opt-section">
      <h2>Nudges</h2>
      <div class="nudge-bar">
        <label class="nudge-toggle">
          <span class="toggle-track">
            <input type="checkbox" id="nudge-toggle-input">
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-label">🔔 Nudges</span>
        </label>
        <span class="nudge-sep">every</span>
        <input id="nudge-minutes" class="nudge-hours-input" type="number" min="1" max="10080" value="60">
        <span class="nudge-sep">min</span>
        <button id="btn-test" class="test-btn">Test</button>
      </div>
    </div>

    <div class="opt-section">
      <h2>Data</h2>
      <div class="toolbar">
        <button id="btn-popup" class="tool-btn">🗂 View popup</button>
        <button id="btn-export" class="tool-btn">⬆ Export</button>
        <button id="btn-import" class="tool-btn">⬇ Import</button>
        <input type="file" id="import-file" accept=".json" style="display:none">
      </div>
    </div>

    <div class="opt-section">
      <h2>Updates</h2>
      <p id="update-text">Checking is automatic once a day.</p>
      <button id="btn-check-update" class="tool-btn">🔄 Check for updates</button>
    </div>

    <div class="opt-section">
      <h2>About</h2>
      <div id="about"></div>
    </div>

    <footer>
      <span id="status-msg"></span>
    </footer>
  </div>
  <script src="utils.js"></script>
  <script src="options.js"></script>
</body>
</html>
