<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Extractor</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* Override the popup's fixed 400px / 600px body so the panel fills the window */
    html, body { width: 100%; height: 100%; min-height: 0; max-height: none; margin: 0; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    header { flex: 0 0 auto; }
    #panel { flex: 0 0 auto; padding: 6px 8px; }
    #chat-frame { flex: 1 1 0; width: 100%; min-height: 0; border: 0; display: none; }
    #empty { flex: 1 1 0; padding: 16px; display: none; }
    footer { flex: 0 0 auto; flex-wrap: wrap; padding: 6px 8px; gap: 6px; }
    #status-msg { flex-basis: 100%; text-align: left; min-height: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <span class="logo">📚</span>
        <h1>Learning</h1>
      </div>
    </header>
    <div id="panel"></div>
    <p id="empty" class="empty">Pick a chat from the list (click its title) to learn it here.</p>
    <iframe id="chat-frame" title="Chat"></iframe>
    <footer>
      <button id="btn-copy" class="foot-btn">📋 Prompt</button>
      <button id="btn-all" class="foot-btn">🗂 All chats</button>
      <button id="btn-opts" class="foot-btn">⚙ Options</button>
      <button id="btn-tab" class="foot-btn">↗ Tab</button>
      <span id="status-msg"></span>
    </footer>
  </div>
  <script src="utils.js"></script>
  <script src="prompt.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
